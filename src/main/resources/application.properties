spring.application.name=ST-taller-git-2026
server.port=8081
spring.datasource.url=jdbc:h2:file:./data/entidades
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/upgrade-entidades.sql
restful-api.base-url=https://api.restful-api.dev
restful-api.timeout=10s
minecraft-remoto.base-url=http://100.78.121.31:8080
minecraft-remoto.timeout=5s
nico.base-url=http://100.83.179.97:8080
nico.timeout=5s
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=py.edu.uc.lp3.rest.controller
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
